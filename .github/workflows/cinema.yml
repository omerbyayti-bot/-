name: FROST CINEMA

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  cinema:
    runs-on: ubuntu-latest

    steps:
      - name: Send new releases to Discord
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.parse
          import urllib.error
          import json
          import os
          from datetime import datetime, timezone

          TMDB = "https://api.themoviedb.org/3"
          API_TOKEN = os.environ["TMDB_API_KEY"]
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          def get(url, params=None):
              if params is None:
                  params = {}

              if params:
                  url += "?" + urllib.parse.urlencode(params)

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {API_TOKEN}",
                      "Accept": "application/json",
                      "User-Agent": "FROST-CINEMA"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode("utf-8"))

              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print("TMDB ERROR:", e.code, body)
                  raise

          def post_discord(payload):
              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  WEBHOOK,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "FROST-CINEMA"
                  }
              )

              with urllib.request.urlopen(req) as response:
                  return response.read()

          def find_trailer(videos):
              results = videos.get("results", [])

              for video in results:
                  if (
                      video.get("site") == "YouTube"
                      and video.get("type") == "Trailer"
                      and video.get("official") is True
                  ):
                      return "https://www.youtube.com/watch?v=" + video["key"]

              for video in results:
                  if (
                      video.get("site") == "YouTube"
                      and video.get("type") == "Trailer"
                  ):
                      return "https://www.youtube.com/watch?v=" + video["key"]

              return None

          def send_movie(movie):
              movie_id = movie["id"]

              details = get(
                  f"{TMDB}/movie/{movie_id}",
                  {
                      "language": "en-US",
                      "append_to_response": "videos"
                  }
              )

              title = movie.get("title", "Unknown")
              release_date = movie.get("release_date") or today
              rating = movie.get("vote_average", 0)
              overview = movie.get("overview") or "No description available."

              poster = movie.get("poster_path")

              poster_url = None

              if poster:
                  poster_url = (
                      "https://image.tmdb.org/t/p/w500" + poster
                  )

              trailer = find_trailer(
                  details.get("videos", {})
              )

              embed = {
                  "title": f"🎬 MOVIE • {title}",
                  "description": overview,
                  "url": f"https://www.themoviedb.org/movie/{movie_id}",
                  "fields": [
                      {
                          "name": "📅 Release Date",
                          "value": release_date,
                          "inline": True
                      },
                      {
                          "name": "⭐ Rating",
                          "value": f"{rating:.1f}/10",
                          "inline": True
                      }
                  ],
                  "footer": {
                      "text": "FROST CINEMA • Data from TMDB"
                  }
              }

              if poster_url:
                  embed["image"] = {
                      "url": poster_url
                  }

              if trailer:
                  embed["fields"].append({
                      "name": "▶️ Official Trailer",
                      "value": f"[Watch Trailer]({trailer})",
                      "inline": False
                  })

              post_discord({
                  "username": "FROST CINEMA",
                  "embeds": [embed]
              })

              print("Movie sent:", title)

          def send_tv(show):
              show_id = show["id"]

              details = get(
                  f"{TMDB}/tv/{show_id}",
                  {
                      "language": "en-US",
                      "append_to_response": "videos"
                  }
              )

              title = show.get("name", "Unknown")
              release_date = show.get("first_air_date") or today
              rating = show.get("vote_average", 0)
              overview = show.get("overview") or "No description available."

              poster = show.get("poster_path")

              poster_url = None

              if poster:
                  poster_url = (
                      "https://image.tmdb.org/t/p/w500" + poster
                  )

              trailer = find_trailer(
                  details.get("videos", {})
              )

              embed = {
                  "title": f"📺 SERIES • {title}",
                  "description": overview,
                  "url": f"https://www.themoviedb.org/tv/{show_id}",
                  "fields": [
                      {
                          "name": "📅 First Air Date",
                          "value": release_date,
                          "inline": True
                      },
                      {
                          "name": "⭐ Rating",
                          "value": f"{rating:.1f}/10",
                          "inline": True
                      }
                  ],
                  "footer": {
                      "text": "FROST CINEMA • Data from TMDB"
                  }
              }

              if poster_url:
                  embed["image"] = {
                      "url": poster_url
                  }

              if trailer:
                  embed["fields"].append({
                      "name": "▶️ Official Trailer",
                      "value": f"[Watch Trailer]({trailer})",
                      "inline": False
                  })

              post_discord({
                  "username": "FROST CINEMA",
                  "embeds": [embed]
              })

              print("Series sent:", title)

          print("================================")
          print("FROST CINEMA")
          print("Checking releases for:", today)
          print("================================")

          movies = get(
              f"{TMDB}/discover/movie",
              {
                  "language": "en-US",
                  "include_adult": "false",
                  "include_video": "false",
                  "primary_release_date.gte": today,
                  "primary_release_date.lte": today,
                  "sort_by": "popularity.desc",
                  "page": 1
              }
          )

          shows = get(
              f"{TMDB}/discover/tv",
              {
                  "language": "en-US",
                  "include_adult": "false",
                  "include_null_first_air_dates": "false",
                  "first_air_date.gte": today,
                  "first_air_date.lte": today,
                  "sort_by": "popularity.desc",
                  "page": 1
              }
          )

          print("Movies found:", len(movies.get("results", [])))
          print("Series found:", len(shows.get("results", [])))

          for movie in movies.get("results", []):
              try:
                  send_movie(movie)
              except Exception as e:
                  print("Movie error:", e)

          for show in shows.get("results", []):
              try:
                  send_tv(show)
              except Exception as e:
                  print("TV error:", e)

          print("================================")
          print("FROST CINEMA finished.")
          print("================================")
          PY
